name: Fetch whisky news

on:
  schedule:
      - cron: "17 * * * *"
        workflow_dispatch: {}

        permissions:
          contents: write

          jobs:
            fetch:
                runs-on: ubuntu-latest
                    steps:
                          - name: Check out repo
                                  uses: actions/checkout@v4

                                        - name: Set up Python
                                                uses: actions/setup-python@v5
                                                        with:
                                                                  python-version: "3.12"

                                                                        - name: Fetch news
                                                                                run: python fetch_news.py

                                                                                      - name: Commit updated feed if changed
                                                                                              run: |
                                                                                                        git config user.name "whisky-news-bot"
                                                                                                                  git config user.email "actions@users.noreply.github.com"
                                                                                                                            git add whisky-news.json
                                                                                                                                      if git diff --cached --quiet; then
                                                                                                                                                  echo "No changes to commit"
                                                                                                                                                            else
                                                                                                                                                                        git commit -m "Update whisky news feed"
                                                                                                                                                                                    git push
                                                                                                                                                                                              fi
                                                                                                                                                                                              
